          description: Simulation updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeSimulationResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteIncomeSimulation
      tags: [finance-income]
      summary: Delete a saved income simulation
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/SimulationId" }]
      responses:
        "204": { description: Simulation deleted }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/income-simulations/{simulation_id}/duplicate:
    post:
      operationId: duplicateIncomeSimulation
      tags: [finance-income]
      summary: Duplicate a saved income simulation
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/SimulationId" }]
      responses:
        "201":
          description: Simulation duplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeSimulationResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/imports/templates/{import_type}:
    get:
      operationId: getImportTemplate
      tags: [import-export]
      summary: Download an official XLSX import template
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ImportType"
      responses:
        "200":
          description: XLSX template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/imports:
    post:
      operationId: createImport
      tags: [import-export]
      summary: Upload and validate an official XLSX import file
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  $ref: "#/components/schemas/ImportType"
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Import job created and validated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/imports/{import_id}:
    get:
      operationId: getImport
      tags: [import-export]
      summary: Get an import preview and validation result
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Import job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteImport
      tags: [import-export]
      summary: Discard an import job and its temporary file
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "204": { description: Import job discarded }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/imports/{import_id}/validate:
    post:
      operationId: validateImport
      tags: [import-export]
      summary: Revalidate an import job before confirmation
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/imports/{import_id}/commit:
    post:
      operationId: commitImport
      tags: [import-export]
      summary: Confirm and transactionally import validated rows
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Committed import job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/exports/{export_type}:
    get:
      operationId: exportData
      tags: [import-export]
      summary: Export current-user structured data or a complete account ZIP
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ExportType"
        - $ref: "#/components/parameters/ExportFormat"
      responses:
        "200":
          description: Export file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/ErrorResponse" }
components:
