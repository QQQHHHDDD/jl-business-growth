      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    AccountsListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"
    AccountsListResponse:
      type: object
      required: [data, meta, request_id]
