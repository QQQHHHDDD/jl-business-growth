          type: string
        role:
          type: string
          enum: [USER, ADMIN, SUPER_ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        timezone:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
    SessionAccount:
