      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BusinessDate:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    DateFrom:
      name: from
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      schema:
        type: string
        format: date
    WorkDate:
      name: work_date
      in: path
      required: true
      schema:
        type: string
        format: date
    TurnoverDate:
      name: turnover_date
      in: path
      required: true
      schema:
        type: string
        format: date
    DreamId:
      name: dream_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: goal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarEventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    CalendarTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    ReviewType:
      name: review_type
      in: path
      required: true
      schema:
        type: string
        enum: [DAILY, WEEKLY, MONTHLY]
    ReviewPeriodStart:
      name: period_start
