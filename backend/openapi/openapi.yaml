      name: import_type
      in: path
      required: true
      schema:
        type: string
        enum: [WORKLOG, FINANCE, TEAM, TURNOVER]
    ExportType:
      name: export_type
      in: path
      required: true
      schema:
        type: string
        enum: [WORKLOG, TURNOVER, FINANCE, TEAM, KNOWLEDGE, ACCOUNT]
    ExportFormat:
      name: format
      in: query
      required: true
      schema:
        type: string
        enum: [csv, xlsx, json, markdown, zip]
  responses:
    ErrorResponse:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthData:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ready, unavailable]
    HealthResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        request_id:
          type: string
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        request_id:
          type: string
    ImportJob:
      type: object
      required: [id, type, status, row_count, valid_count, invalid_count, validation_summary, expires_at, created_at, rows]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [WORKLOG, FINANCE, TEAM, TURNOVER]
        status:
          type: string
          enum: [UPLOADED, VALIDATED, COMMITTED, FAILED, EXPIRED]
        row_count: { type: integer, minimum: 0 }
        valid_count: { type: integer, minimum: 0 }
        invalid_count: { type: integer, minimum: 0 }
        validation_summary:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportPreviewRow" }
    ImportPreviewRow:
      type: object
      required: [row_number, values, errors, warnings]
      properties:
        row_number: { type: integer, minimum: 2 }
        values:
          type: object
          additionalProperties: { type: string }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
    ImportJobResponse:
      type: object
      required: [data, request_id]
      properties:
        data: { $ref: "#/components/schemas/ImportJob" }
        request_id: { type: string }
    ImportType:
      type: string
      enum: [WORKLOG, FINANCE, TEAM, TURNOVER]
    Account:
