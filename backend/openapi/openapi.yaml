      properties:
        data:
          $ref: "#/components/schemas/AccountsData"
        request_id:
          type: string
    AccountResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/Account"
        request_id:
          type: string
    PaginationMeta:
      type: object
