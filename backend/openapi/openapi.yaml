openapi: 3.0.3
info:
  title: JL Business Growth API
  version: 0.2.0
  description: HTTP contract for the JL团队生意成长管理系统.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: admin
  - name: daily-core
  - name: calendar-reviews
paths:
  /api/health/live:
    get:
      operationId: getHealthLive
      tags: [health]
      summary: Check whether the API process is live
      responses:
        "200":
          description: API process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/health/ready:
    get:
      operationId: getHealthReady
      tags: [health]
      summary: Check whether required runtime dependencies are ready
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      summary: Register a normal user with an invitation code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Sign in an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Account signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: End the current browser session
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Session ended
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [auth]
      summary: Return the CSRF token for the current browser session
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Return the active account
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Active account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/change-password:
    post:
      operationId: postAuthChangePassword
      tags: [auth]
      summary: Change the active account password
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and sessions invalidated
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/me/timezone:
    patch:
      operationId: patchAuthTimezone
      tags: [auth]
      summary: Change the active account timezone
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimezoneRequest"
      responses:
        "200":
          description: Updated active account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/accounts:
    get:
      operationId: getAuthAccounts
      tags: [auth]
      summary: List normal accounts linked to this browser session
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Linked accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/accounts/add:
    post:
      operationId: postAuthAccountsAdd
      tags: [auth]
      summary: Authenticate and add another normal account to this browser session
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Account added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/accounts/{account_id}/switch:
    post:
      operationId: postAuthAccountsSwitch
      tags: [auth]
      summary: Switch the active normal account without re-entering its password
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Active account switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/auth/accounts/{account_id}:
    delete:
      operationId: deleteAuthAccount
      tags: [auth]
      summary: Remove a linked normal account from this browser session
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Account unlinked
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List normal users without business data
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/users/{account_id}/status:
    patch:
      operationId: patchAdminUserStatus
      tags: [admin]
      summary: Enable or disable a normal user
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/users/{account_id}/reset-password:
    post:
      operationId: postAdminUserResetPassword
      tags: [admin]
      summary: Reset a normal user password
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Temporary password result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/users/{account_id}:
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a normal user and its online access
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: User deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/invitation-codes:
    get:
      operationId: getAdminInvitationCodes
      tags: [admin]
      summary: List invitation codes
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: postAdminInvitationCode
      tags: [admin]
      summary: Create an invitation code
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/invitation-codes/{invitation_id}:
    patch:
      operationId: patchAdminInvitationCode
      tags: [admin]
      summary: Update invitation status or limits
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvitationRequest"
      responses:
        "200":
          description: Updated invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteAdminInvitationCode
      tags: [admin]
      summary: Disable an invitation code
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: Invitation disabled
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/admins:
    get:
      operationId: getAdminAdmins
      tags: [admin]
      summary: List ordinary administrators
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Administrator list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: postAdminAdmin
      tags: [admin]
      summary: Create an ordinary administrator
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
      responses:
        "201":
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/admins/{account_id}:
    patch:
      operationId: patchAdminAdmin
      tags: [admin]
      summary: Enable or disable an ordinary administrator
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
      responses:
        "200":
          description: Updated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteAdminAdmin
      tags: [admin]
      summary: Delete an ordinary administrator
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Administrator deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/admins/{account_id}/reset-password:
    post:
      operationId: postAdminAdminResetPassword
      tags: [admin]
      summary: Reset an ordinary administrator password
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Temporary password result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/dashboard:
    get:
      operationId: getDashboard
      tags: [daily-core]
      summary: Return the user dashboard aggregates for a business date
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/BusinessDate"
      responses:
        "200":
          description: Dashboard aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/worklogs:
    get:
      operationId: listWorklogs
      tags: [daily-core]
      summary: List daily worklogs in a business-date range
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Daily worklogs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklogListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createWorklog
      tags: [daily-core]
      summary: Create or replace a daily worklog
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorklogRequest"
      responses:
        "201":
          description: Worklog saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklogResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/worklogs/{work_date}:
    get:
      operationId: getWorklog
      tags: [daily-core]
      summary: Get a daily worklog
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkDate"
      responses:
        "200":
          description: Daily worklog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklogResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateWorklog
      tags: [daily-core]
      summary: Replace a daily worklog
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkDate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorklogRequest"
      responses:
        "200":
          description: Worklog saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklogResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteWorklog
      tags: [daily-core]
      summary: Delete a daily worklog
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkDate"
      responses:
        "204":
          description: Worklog deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/turnover:
    get:
      operationId: listTurnovers
      tags: [daily-core]
      summary: List daily turnovers in a business-date range
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Daily turnovers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnoverListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createTurnover
      tags: [daily-core]
      summary: Create or replace a daily turnover
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnoverRequest"
      responses:
        "201":
          description: Turnover saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnoverResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/turnover/{turnover_date}:
    get:
      operationId: getTurnover
      tags: [daily-core]
      summary: Get turnover for a business date
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TurnoverDate"
      responses:
        "200":
          description: Daily turnover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnoverResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateTurnover
      tags: [daily-core]
      summary: Replace turnover for a business date
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TurnoverDate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnoverRequest"
      responses:
        "200":
          description: Turnover saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnoverResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteTurnover
      tags: [daily-core]
      summary: Delete turnover for a business date
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TurnoverDate"
      responses:
        "204":
          description: Turnover deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/dreams:
    get:
      operationId: listDreams
      tags: [daily-core]
      summary: List dreams for the current user
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Dreams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DreamListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createDream
      tags: [daily-core]
      summary: Create a dream
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DreamRequest"
      responses:
        "201":
          description: Dream created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DreamResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/dreams/{dream_id}:
    get:
      operationId: getDream
      tags: [daily-core]
      summary: Get a dream
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DreamId"
      responses:
        "200":
          description: Dream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DreamResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateDream
      tags: [daily-core]
      summary: Replace a dream
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DreamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DreamRequest"
      responses:
        "200":
          description: Dream updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DreamResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteDream
      tags: [daily-core]
      summary: Delete a dream
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DreamId"
      responses:
        "204":
          description: Dream deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/goals:
    get:
      operationId: listGoals
      tags: [daily-core]
      summary: List goals with calculated progress
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createGoal
      tags: [daily-core]
      summary: Create a goal
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRequest"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/goals/{goal_id}:
    get:
      operationId: getGoal
      tags: [daily-core]
      summary: Get a goal with calculated progress
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateGoal
      tags: [daily-core]
      summary: Replace a goal
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRequest"
      responses:
        "200":
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteGoal
      tags: [daily-core]
      summary: Delete a goal and its descendants
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "204":
          description: Goal deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [calendar-reviews]
      summary: List expanded calendar event occurrences in a time range
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarFrom"
        - $ref: "#/components/parameters/CalendarTo"
      responses:
        "200":
          description: Calendar occurrences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEventListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createCalendarEvent
      tags: [calendar-reviews]
      summary: Create a one-time or recurring calendar event
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventRequest"
      responses:
        "201":
          description: Calendar event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEventResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/calendar/events/{event_id}:
    get:
      operationId: getCalendarEvent
      tags: [calendar-reviews]
      summary: Get a calendar event series
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarEventId"
      responses:
        "200":
          description: Calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEventResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateCalendarEvent
      tags: [calendar-reviews]
      summary: Update an entire series, one occurrence, or an occurrence and following events
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarEventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventRequest"
      responses:
        "200":
          description: Calendar event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEventResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar-reviews]
      summary: Delete a calendar event series and send cancellation notices
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarEventId"
      responses:
        "204":
          description: Calendar event deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/reviews:
    get:
      operationId: listReviews
      tags: [calendar-reviews]
      summary: List saved daily, weekly, or monthly reviews
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/reviews/{review_type}/{period_start}:
    get:
      operationId: getReview
      tags: [calendar-reviews]
      summary: Get a review and its live period totals
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ReviewType"
        - $ref: "#/components/parameters/ReviewPeriodStart"
      responses:
        "200":
          description: Review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateReview
      tags: [calendar-reviews]
      summary: Create or update one review for its period
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ReviewType"
        - $ref: "#/components/parameters/ReviewPeriodStart"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Review saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/analytics/worklogs:
    get:
      operationId: getWorklogAnalytics
      tags: [calendar-reviews]
      summary: Aggregate worklogs by day, week, or month
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/AnalyticsGranularity"
      responses:
        "200":
          description: Worklog analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/analytics/turnover:
    get:
      operationId: getTurnoverAnalytics
      tags: [calendar-reviews]
      summary: Aggregate turnover by day, week, or month
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/AnalyticsGranularity"
      responses:
        "200":
          description: Turnover analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/analytics/goals:
    get:
      operationId: getGoalAnalytics
      tags: [calendar-reviews]
      summary: Aggregate goals by their business start date
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/AnalyticsGranularity"
      responses:
        "200":
          description: Goal analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-bos_session
  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BusinessDate:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    DateFrom:
      name: from
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      schema:
        type: string
        format: date
    WorkDate:
      name: work_date
      in: path
      required: true
      schema:
        type: string
        format: date
    TurnoverDate:
      name: turnover_date
      in: path
      required: true
      schema:
        type: string
        format: date
    DreamId:
      name: dream_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: goal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarEventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    CalendarTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    ReviewType:
      name: review_type
      in: path
      required: true
      schema:
        type: string
        enum: [DAILY, WEEKLY, MONTHLY]
    ReviewPeriodStart:
      name: period_start
      in: path
      required: true
      schema:
        type: string
        format: date
    AnalyticsGranularity:
      name: granularity
      in: query
      required: true
      schema:
        type: string
        enum: [day, week, month]
  responses:
    ErrorResponse:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthData:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ready, unavailable]
    HealthResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        request_id:
          type: string
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        request_id:
          type: string
    Account:
      type: object
      required: [id, username, role, status, timezone, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [USER, ADMIN, SUPER_ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        timezone:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
    SessionAccount:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [active]
          properties:
            active:
              type: boolean
    RegisterRequest:
      type: object
      required: [username, password, invitation_code]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          minLength: 10
          maxLength: 128
        invitation_code:
          type: string
          minLength: 1
          maxLength: 64
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          minLength: 10
          maxLength: 128
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    TimezoneRequest:
      type: object
      required: [timezone]
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    StatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    ResetPasswordRequest:
      type: object
      properties:
        temporary_password:
          type: string
          minLength: 10
          maxLength: 128
    CreateAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          minLength: 10
          maxLength: 128
    CreateInvitationRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 64
        max_uses:
          type: integer
          minimum: 1
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    UpdateInvitationRequest:
      type: object
      properties:
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        max_uses:
          type: integer
          minimum: 1
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        clear_max_uses:
          type: boolean
          default: false
          description: Clear max_uses and make the code unlimited.
        clear_expires_at:
          type: boolean
          default: false
          description: Clear expires_at and make the code non-expiring.
    AuthData:
      type: object
      required: [account, csrf_token, accounts]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        csrf_token:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/SessionAccount"
    AuthResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/AuthData"
        request_id:
          type: string
    CsrfData:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
    CsrfResponse:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: "#/components/schemas/CsrfData"
        request_id:
          type: string
    AccountsData:
      type: object
      required: [account, accounts, csrf_token]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        accounts:
          type: array
          items:
